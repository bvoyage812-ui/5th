<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Caveat:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1226;--bg2:#2b1a38;--rose:#ff8fa3;--blush:#ffe3ea;--gold:#f4c98a;--ink:#f7eef2}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,.script{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500}

/* ---------- Envelope (the one memorable moment) ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;opacity:0;transition:opacity 1.2s ease .6s}
body.opened main{opacity:1}
.glow{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.35}
.glow.a{width:320px;height:320px;background:#ff6f91;top:-80px;left:-100px}
.glow.b{width:380px;height:380px;background:#7a4cc2;bottom:-120px;right:-140px}
#gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:transparent;transition:opacity .9s ease .5s,visibility 0s 1.4s}
#gate.open{opacity:0;visibility:hidden}
.env{position:relative;width:min(84vw,360px);aspect-ratio:3/2;background:#3a2349;border-radius:6px;cursor:pointer;box-shadow:0 30px 60px rgba(0,0,0,.45);border:0;padding:0;color:inherit;font:inherit}
.env:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
.flap{position:absolute;inset:0 0 auto 0;height:62%;background:#4b2d5e;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease}
.env.open .flap{transform:rotateX(180deg)}
.fold{position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.5%,#331f41 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,#331f41 50%) right/50% 100% no-repeat}
.seal{position:absolute;left:50%;top:62%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--rose);display:grid;place-items:center;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:opacity .3s}
.env.open .seal{opacity:0}
.hint{position:absolute;bottom:-46px;width:100%;text-align:center;color:var(--blush);opacity:.8;font-size:.95rem}
@media (prefers-reduced-motion:no-preference){.seal{animation:beat 1.8s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.12)}}}

/* ---------- Letter ---------- */
main{max-width:620px;margin:0 auto;padding:72px 24px 120px}
.hero{text-align:center;padding:40px 0 56px}
.hero h1{font-size:clamp(2.8rem,12vw,4.6rem);line-height:1.05;color:var(--blush)}
.hero p{margin-top:14px;color:var(--gold);font-size:1.05rem}
.counter{display:flex;justify-content:center;gap:22px;margin:34px 0 0}
.counter div{text-align:center}
.counter b{display:block;font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:500;color:var(--rose);line-height:1}
.counter span{font-size:.85rem;opacity:.75}

section{margin-top:64px}
h2{font-size:2rem;color:var(--blush);margin-bottom:18px}
/* ---------- Handwritten paper letter ---------- */
.paper{position:relative;background:linear-gradient(180deg,#fffaf0,#f7ecd6);color:#2f2a5a;border-radius:3px;padding:34px 22px 30px 58px;transform:rotate(-.5deg);
  box-shadow:0 2px 0 #eadcc0,0 18px 40px rgba(0,0,0,.45),inset 0 0 60px rgba(190,150,90,.14)}
.paper::before{content:"";position:absolute;top:0;bottom:0;left:42px;width:2px;background:rgba(224,90,110,.45)}
.paper::after{content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:rgba(255,143,163,.55);transform:rotate(2deg);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.lines{background:repeating-linear-gradient(transparent 0 calc(2rem - 1px),rgba(110,140,200,.32) calc(2rem - 1px) 2rem);font-family:'Caveat','Segoe Script','Bradley Hand',cursive}
.letter h2{font-family:inherit;font-style:normal;font-weight:600;font-size:2.2rem;line-height:4rem;margin:0;color:#c2365a}
.letter p{font-family:inherit;font-style:normal;font-size:1.45rem;line-height:2rem;margin:0 0 2rem;font-weight:500;overflow-wrap:break-word}
.sign{text-align:right;font-family:inherit;font-style:normal;font-weight:600;font-size:2rem;line-height:4rem;color:#c2365a;margin:0}
@media (max-width:420px){.paper{padding:28px 14px 24px 44px}.paper::before{left:30px}}

.photos{display:grid;gap:18px}
.photos figure{background:var(--blush);padding:10px 10px 14px;border-radius:3px;color:#3a2349;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.photos figure:nth-child(odd){transform:rotate(-1.6deg)}
.photos figure:nth-child(even){transform:rotate(1.4deg)}
.photos .ph{aspect-ratio:4/3;background:linear-gradient(135deg,#caa0b8,#8c5f8f);display:grid;place-items:center;font-size:.9rem;color:#fff;overflow:hidden}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;margin-top:8px;text-align:center}

.reasons{list-style:none;padding:0;display:grid;gap:10px}
.reasons button{width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,143,163,.35);color:var(--ink);font:inherit;padding:14px 16px;border-radius:10px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:52px}
.reasons button:focus-visible{outline:3px solid var(--gold)}
.reasons button{position:relative;overflow:hidden;transition:background .3s,border-color .3s,transform .15s}
.reasons button:active{transform:scale(.97)}
.reasons .q{display:inline-block;flex:none;transition:transform .4s}
.reasons .w{display:grid;grid-template-rows:0fr;flex:1;min-width:0;transition:grid-template-rows .45s ease}
.reasons .t{min-height:0;overflow:hidden;opacity:0;transform:translateY(8px);transition:opacity .4s .1s,transform .4s .1s}
.reasons button[aria-expanded=true] .w{grid-template-rows:1fr}
.reasons button[aria-expanded=true] .t{opacity:1;transform:none}
.reasons button[aria-expanded=true] .q{transform:scale(1.15)}
.reasons button::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,227,234,.28) 50%,transparent 70%);transform:translateX(-110%);pointer-events:none}
@media (prefers-reduced-motion:no-preference){
.reasons button[aria-expanded=true] .q{animation:pop .6s ease}
.reasons button[aria-expanded=true]::after{animation:shine .9s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.8) rotate(-18deg)}70%{transform:scale(.9) rotate(8deg)}100%{transform:scale(1.15)}}
@keyframes shine{to{transform:translateX(110%)}}}
.reasons button[aria-expanded=true]{background:rgba(255,143,163,.16);border-color:var(--rose)}

#music{position:fixed;right:16px;bottom:16px;z-index:5;width:48px;height:48px;border-radius:50%;border:0;background:var(--rose);color:#3a2349;font-size:20px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#music:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>

<div class="glow a"></div><div class="glow b"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- Envelope: tap to open (also starts the music, which phones only allow after a tap) -->
<div id="gate">
  <button class="env" id="env" aria-label="Open your letter">
    <div class="fold"></div><div class="flap"></div><div class="seal" aria-hidden="true">♥</div>
    <div class="hint" id="hint"></div>
  </button>
</div>

<main>
  <header class="hero">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <div class="counter" id="counter"></div>
  </header>

  <section class="letter">
    <div class="paper"><div class="lines">
      <h2 id="greeting"></h2>
      <div id="paras"></div>
      <div class="sign" id="sign"></div>
    </div></div>
  </section>

  <section>
    <h2 id="photosTitle"></h2>
    <div class="photos" id="photos"></div>
  </section>

  <section>
    <h2 id="reasonsTitle"></h2>
    <ul class="reasons" id="reasons"></ul>
  </section>
</main>

<button id="music" aria-label="Toggle music" hidden>♪</button>
<audio id="song" loop preload="none"></audio>

<script>


const LOVE = {
  tapHint:      "Tap to open",
  title:        "Happy 5th Monthsary",
  subtitle:     "It is our 5th month-anniversary hehehe and I hope this makes you smile today, I love you.",

  
  startDate:    "06/10/2026", // mm/dd/yyyy

  greeting:     "Mi Amor,",
  paragraphs: [
    "Another month has passed again and It went by so fast like a blink of an eye, I still can't believe we are already 5 months together and yet it still feels like yesterday when we first met.",
    "I remember the first silly code i made for you and it was a simple html pages with silly gif images so that i can make you happy, and smile more. That was really silly hehe... I had so much memories with you already, getting to know you more and more each day, telling each other our daydreams, dreams, our goals in the future, and our plans together. I love how we can talk about anything and everything, and how we can be ourselves around each other.",
    "I got to admire the prettiest views, then I think of you and you would've love to see it too, together with me. I got to draw the most prettiest silliest things of us and it would make you so happy, this makes me so happy too... knowing that someone admires my work so as much as i do. Then our first ever game \"It Takes Two\" it was really fun playing that with you, we got to make the best memories with that game, specially admiring how pretty the views were and the experiences as well. Having our talks about the things that hurted us or bothered us... I don't hate what happened, I'm glad i was able to fix it with you. Then our first date, then a jog to the shrine where you were barely awake hehe, The morning walks for you and mine as well, and a trip to the zoo... these will be forever treasured in my heart. Atesoro estos maravillosos recuerdos que pude compartir contigo de manera virtual. Te amo mucho amor, y espero que podamos seguir creando más recuerdos juntos en el futuro.",
    "I love the fact that we can be silly and goofy together, I could be saying so many stupid things and you would still find it cute somehow. I'm glad you decided to trust me with your secrets, thoughts, and your feelings, and I hope you know that I will always be here for you, to listen to you, to support you, and to love you unconditionally.",
    "These wonderful memories of us texting each other quite a lot each day and talking on discord calls beating our long calls somehow and we still have things to talk about still, I'm glad I could spend a day doing nothing just silence with you and just enjoying each other's presence, being there without having to think about what to say or do.",
    "Thank you for being thoughtful, caring and patient with me. Thank you for the things you made and bought while thinking about me, thank you for worrying about me whenever I do something rash or get sick, Thank you for being patient with me and trying your best as well, for noticing the little things in life. I'm glad I met you.",
    "Just so you know... You'll always be apart of my prayers amor, along with my family and friends. Keep doing your best and I will as well. Don't forget, I'll always be proud of you."
  ],
  signature:    "Your loving posa :D",

  photosTitle:  "Us",
 
  photos: [
    { src: "image.png", caption: "First time I met you" },
    { src: "Bridge.png", caption: "A place I wanna see personally" },
    { src: "Minecraft Screenshot 2026.10.18 - 00.55.25.07.png", caption: "Our first minecraft world together" }
  ],

  reasonsTitle: "Reasons why I think you're cool",

  reasons: [
    "I like your music taste, since I have a thing for badass music too.",
    "You aim so well, got a lot of kills and I admire that as a fellow gamer (I watched your gameplays so I can confidently say this)",
    "You could talk about for honor as long as you want and I would listen, not just for honor but other games too.",
    "You can bake?! like that's impressive :D",
    "You introduce me to your friends and I enjoy listening to you talk about them and your experiences with them.",
    "You're very smart when it comes to techy stuff, I admire and support you.",
    "You have a potential using your voice too, whether it would be voice acting or singing. I think that is cool.",
    "You make me laugh so much sometimes I get carried away and forget about the time.",
    "Lastly, You have squeezable ahh... I mean... ehrm HEHEHE"
  ],

  
  background:   "mixed",
 
  bgColors:     ["#ff8fa3", "#ffe3ea", "#f4c98a", "#c9a3ff"],

  
  music: "Plain White T's - Hey There Delilah (Emotional Piano Ballad Cover).mp3"
};

const $ = id => document.getElementById(id);
$('hint').textContent = LOVE.tapHint;
$('title').textContent = LOVE.title;
$('subtitle').textContent = LOVE.subtitle;
$('greeting').textContent = LOVE.greeting;
$('sign').textContent = LOVE.signature;
$('photosTitle').textContent = LOVE.photosTitle;
$('reasonsTitle').textContent = LOVE.reasonsTitle;
document.title = LOVE.title;

LOVE.paragraphs.forEach(t => { const p = document.createElement('p'); p.textContent = t; $('paras').appendChild(p); });

LOVE.photos.forEach(ph => {
  const f = document.createElement('figure');
  const box = document.createElement('div'); box.className = 'ph';
  if (ph.src) { const i = document.createElement('img'); i.src = ph.src; i.alt = ph.caption || ''; box.appendChild(i); } else { box.textContent = '♥ your photo here'; }
  const c = document.createElement('figcaption'); c.textContent = ph.caption || '';
  f.append(box, c); $('photos').appendChild(f);
});

LOVE.reasons.forEach(r => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.setAttribute('aria-expanded', 'false');
  b.innerHTML = '<span class="q" aria-hidden="true">💗</span><span class="w"><span class="t"></span></span>';
  b.querySelector('.t').textContent = r;
  b.setAttribute('aria-label', 'Reveal a reason');
  b.onclick = e => { const o = b.getAttribute('aria-expanded') === 'true'; b.setAttribute('aria-expanded', !o); b.setAttribute('aria-label', o ? 'Reveal a reason' : r); if (!o) burst(e, b); };
  li.appendChild(b); $('reasons').appendChild(li);
});

// Heart burst when a reason opens
function burst(e, b) {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches || !b.animate) return;
  const rc = b.getBoundingClientRect();
  const x = e.detail ? e.clientX : rc.left + 28, y = e.detail ? e.clientY : rc.top + rc.height / 2;
  for (let i = 0; i < 12; i++) {
    const h = document.createElement('span'), a = Math.random() * 6.283, d = 40 + Math.random() * 70;
    h.textContent = '♥';
    h.style.cssText = 'position:fixed;z-index:20;pointer-events:none;left:' + x + 'px;top:' + y + 'px;font-size:' + (10 + Math.random() * 14) + 'px;color:' + LOVE.bgColors[i % LOVE.bgColors.length];
    document.body.appendChild(h);
    h.animate([
      { transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 },
      { transform: 'translate(calc(-50% + ' + Math.cos(a) * d + 'px),calc(-50% + ' + (Math.sin(a) * d - 30) + 'px)) scale(1)', opacity: 1, offset: .6 },
      { transform: 'translate(calc(-50% + ' + Math.cos(a) * d * 1.2 + 'px),calc(-50% + ' + (Math.sin(a) * d - 80) + 'px)) scale(.6)', opacity: 0 }
    ], { duration: 900 + Math.random() * 400, easing: 'ease-out' }).onfinish = () => h.remove();
  }
}

// Days together
if (LOVE.startDate) {
  const mm = String(LOVE.startDate).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  const s = mm ? new Date(+mm[3], +mm[1] - 1, +mm[2]) : new Date(LOVE.startDate + 'T00:00:00'), n = new Date();
  if (!isNaN(s) && s <= n) {
    let m = (n.getFullYear() - s.getFullYear()) * 12 + n.getMonth() - s.getMonth();
    if (n.getDate() < s.getDate()) m--;
    const days = Math.floor((n - s) / 864e5);
    $('counter').innerHTML = '<div><b>' + days + '</b><span>days</span></div><div><b>' + m + '</b><span>months</span></div>';
  }
}

// Background animation: bubbles, hearts, twinkling stars
(function () {
  const mode = LOVE.background || 'mixed';
  const cv = $('fx');
  if (mode === 'off') { cv.remove(); document.querySelectorAll('.glow').forEach(g => g.remove()); return; }
  const ctx = cv.getContext('2d'), cols = LOVE.bgColors, still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W, H, items = [];
  const kinds = mode === 'mixed' ? ['bubble', 'heart', 'star'] : [mode.replace(/s$/, '')];
  const rnd = (a, b) => a + Math.random() * (b - a);
  function make(initial) {
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    return { kind, x: rnd(0, W), y: initial ? rnd(0, H) : H + 40, r: kind === 'bubble' ? rnd(6, 28) : kind === 'heart' ? rnd(8, 18) : rnd(1.5, 3.5),
      v: kind === 'star' ? 0 : rnd(.25, .9), sway: rnd(.4, 1.4), ph: rnd(0, 6.28), c: cols[Math.floor(Math.random() * cols.length)], t: rnd(0, 6.28) };
  }
  function resize() {
    const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.round(Math.min(46, Math.max(22, W * H / 22000)));
    items = Array.from({ length: n }, () => make(true));
  }
  function heart(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s * .35);
    ctx.bezierCurveTo(x - s, y - s * .35, x - s * .55, y - s * 1.05, x, y - s * .45);
    ctx.bezierCurveTo(x + s * .55, y - s * 1.05, x + s, y - s * .35, x, y + s * .35 + s * .65);
    ctx.fill();
  }
  function draw(time) {
    ctx.clearRect(0, 0, W, H);
    for (const p of items) {
      if (!still) { p.y -= p.v; p.t += .02; p.x += Math.sin(p.t * p.sway + p.ph) * .4; }
      if (p.y < -40) Object.assign(p, make(false), { x: rnd(0, W) });
      ctx.fillStyle = ctx.strokeStyle = p.c;
      if (p.kind === 'bubble') {
        ctx.globalAlpha = .55; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.stroke();
        ctx.globalAlpha = .08; ctx.fill();
        ctx.globalAlpha = .6; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(p.x - p.r * .35, p.y - p.r * .35, p.r * .16, 0, 6.283); ctx.fill();
      } else if (p.kind === 'heart') {
        ctx.globalAlpha = .4; heart(p.x, p.y, p.r);
      } else {
        ctx.globalAlpha = .25 + .65 * Math.abs(Math.sin(time / 900 + p.ph));
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener('resize', resize); resize(); requestAnimationFrame(draw);
})();


const song = $('song'), mb = $('music');
if (LOVE.music) { song.src = LOVE.music; }
$('env').onclick = function () {
  this.classList.add('open');
  document.body.classList.add('opened');
  setTimeout(() => $('gate').classList.add('open'), 500);
  if (LOVE.music) { mb.hidden = false; song.play().catch(() => {}); }
};
mb.onclick = () => { song.paused ? song.play() : song.pause(); mb.style.opacity = song.paused ? .6 : 1; };
</script>
</body>
</html>
